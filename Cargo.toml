[package]
name = "termiban"
version = "0.1.0"
edition = "2024"
description = "Termiban — Terminal Kanban: a self-hosted personal Kanban TUI for Unix (Linux and macOS)"
authors = ["Termiban Contributors"]
license = "MIT"
repository = "https://github.com/yourname/termiban"
keywords = ["kanban", "tui", "ratatui", "productivity", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.42", features = ["serde"] }
